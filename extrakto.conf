# extrakto.conf - filter definitions for rex-extrakto
# User overrides can be placed in ~/.config/extrakto/extrakto.conf or ~/.config/rex/extrakto.conf

[word]
regex: ([^][(){}=$─-➿-⋅↴│ \t\n\r]+)
lstrip: ,:;()[]{}<>'"|
rstrip: ,:;()[]{}<>'"|.
in_all: False

[path]
regex: (?:[ \t\n\"([<':]|^)(~|/)?([-~a-zA-Z0-9_+-,.]+/[^ \t\n\r|:"'$%&)>\]]*)
exclude: [kmgKMG]/s$|^\d+/\d+$
rstrip: ",):"

[url]
regex: (https?://|git@|git://|ssh://|s*ftp://|file:///)([a-zA-Z0-9?=%/_.:,;~@!#$&()*+-]*)
alt2: None
rstrip: ",):"

[quote]
regex: ("[^"\n\r]+")
lstrip: "
rstrip: "
alt2: None

[single-quote]
regex: ('[^'\n\r]+')
lstrip: '
rstrip: '
alt2: None

[backtick]
regex: (`[^`\n\r]+`)
lstrip: `
rstrip: `
alt2: None

[quotes]
regex: ("[^"\n\r]+"|'[^'\n\r]+'|`[^`\n\r]+`)
lstrip: "'`
rstrip: "'`
alt2: None

[git]
regex: \b([0-9a-f]{7,40})\b
in_all: True

[ip]
regex: \b([0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3})\b
in_all: True

[uuid]
regex: \b([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})\b
in_all: True
